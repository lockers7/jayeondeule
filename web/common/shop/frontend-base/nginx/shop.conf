# ============================================================
# 자연들에 쇼핑몰 Nginx 설정
# 포트: 5100
# 기존 사이트(443/80)와 완전 독립
# 다른 서버 이전 시: root 경로와 카메라 proxy IP만 변경
# ============================================================
server {
    listen 5100;
    server_name lockers7.iptime.org;

    client_max_body_size 1100M;

    root /workspace/jayeondeule/shop/frontend/dist;
    index index.html;

    # 업로드 파일 서빙 (빌드 시 삭제되지 않는 별도 경로)
    location /uploads/ {
        alias /workspace/jayeondeule/shop/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 카메라 스트림 프록시 ──
    # 농장 전체 개요 (RPi 5199)
    location /camera/0/1/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }
    # 재배사 1동 (RPi 5101)
    location /camera/1/1/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }
    # 재배사 2동 (RPi 5102)
    location /camera/1/2/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }
    # 재배사 3동 (RPi 5103)
    location /camera/1/3/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # ── Shop API 프록시 ──
    location /api/shop/ {
        proxy_pass http://localhost:9091/api/shop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 자산 캐싱
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

		# farm=main, IP 카메라 — ZY-CAMHIPTZ-A-2M
	# 스냅샷·PTZ : 127.0.0.1:5040 (ipcam_tunnel.service SSH -L)
	# 스트리밍   : 127.0.0.1:5046 (ipcam_mjpeg.service ffmpeg→Flask)
	# Basic auth (admin:Wkdusemfdp1@) 는 nginx 가 자동 주입 — 클라이언트 비밀번호 노출 0.
	location /camera/main/audio {
		proxy_pass http://127.0.0.1:5046/audio;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 600s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		chunked_transfer_encoding off;
	}
	location /camera/main/stream {
		proxy_pass http://127.0.0.1:5046/stream;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 600s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		chunked_transfer_encoding off;
	}
	location /camera/main/ {
		proxy_pass http://jayeondeule.iptime.org:5040/;
		proxy_set_header Authorization "Basic YWRtaW46V2tkdXNlbWZkcDFA";
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 60s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
	}
}
