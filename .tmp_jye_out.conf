# HTTP → HTTPS 리다이렉트
server {
	listen 80;
	server_name lockers7.iptime.org;
	return 301 https://$host$request_uri;
}

# HTTPS
server {
	listen 443 ssl;
	server_name lockers7.iptime.org;

	ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;

	location / {
		root /workspace/jayeondeule/web/frontend/dist;
		index index.html index.htm;
		try_files $uri $uri/ /index.html;
	}

	location /api/ {
		proxy_pass http://localhost:9090/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location /ai-api/ {
		proxy_pass http://localhost:8002/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 300s;
		client_max_body_size 100M;

		proxy_buffering off;
		proxy_cache off;
		proxy_set_header Connection '';
		proxy_http_version 1.1;
		chunked_transfer_encoding off;
	}

	# ── 재배사별 카메라 스트림 프록시 (/camera/{farmId}/{houseId}/) ──
	# farm=0, house=99 → RPi 5199 (개발_99_재배사) → 127.0.0.1:8095
	location /camera/0/99/ {
		proxy_pass http://127.0.0.1:8095/;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 300s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
	}
	# farm=1, house=1 → RPi 5101 → 127.0.0.1:8092
	location /camera/1/1/ {
		proxy_pass http://127.0.0.1:8092/;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 300s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
	}
	# farm=1, house=2 → RPi 5102 → 127.0.0.1:8093
	location /camera/1/2/ {
		proxy_pass http://127.0.0.1:8093/;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 300s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
	}
	# farm=1, house=3 → RPi 5103 → 127.0.0.1:8094
	location /camera/1/3/ {
		proxy_pass http://127.0.0.1:8094/;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 300s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
	}
	# farm=main, IP 카메라 — ZY-CAMHIPTZ-A-2M (192.168.0.40)
	# 스냅샷·PTZ : 127.0.0.1:5040 (ipcam_tunnel.service SSH -L)
	# 스트리밍   : 127.0.0.1:5046 (ipcam_mjpeg.service ffmpeg→Flask)
	# Basic auth (admin:Wkdusemfdp1@) 는 nginx 가 자동 주입 — 클라이언트 비밀번호 노출 0.
	location /camera/main/stream {
		proxy_pass http://127.0.0.1:5046/stream;
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 600s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		chunked_transfer_encoding off;
	}
	location /camera/main/ {
		proxy_pass http://127.0.0.1:5040/;
		proxy_set_header Authorization "Basic YWRtaW46V2tkdXNlbWZkcDFA";
		proxy_buffering off; proxy_cache off;
		proxy_read_timeout 60s;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
	}
}
